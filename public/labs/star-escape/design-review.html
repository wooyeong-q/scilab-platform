<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별과 우리은하 · 디자인 검토</title>
<style>*{box-sizing:border-box}body{margin:0;background:#202a38;color:white;font:14px system-ui}nav{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap}button,select{padding:8px;border-radius:6px;border:1px solid #65849b;background:#0d1a2d;color:white}main{display:flex;justify-content:center}iframe{display:block;border:0;width:100%;height:calc(100vh - 58px);background:#050817}</style>
<nav><b>디자인 검토 · 1인 테스트</b><select id="scene" aria-label="검토 장면"><option value="1,1">1-1 전력 복구</option><option value="1,2">1-2 별 색 배선</option><option value="1,3">1-3 관측 기록</option><option value="2,1">2-1 시차 카드</option><option value="3,1">3-1 별 등급</option><option value="3,3">3-3 거리 비교</option><option value="4,2">4-2 성운 사진</option><option value="4,4">4-4 인증 장치</option></select><button data-size="full">큰 화면</button><button data-size="1024,768">1024 × 768</button><button data-size="390,780">390 × 780</button><button data-size="844,390">844 × 390</button></nav>
<main><iframe id="preview" title="게임 디자인 검토"></iframe></main>
<script>
const frame=document.getElementById('preview');
function loadScene(){
 const [stage,question]=document.getElementById('scene').value.split(',').map(Number), startedAt=new Date().toISOString(), player={id:'design-review',nickname:'디자인 검토',team:'1인 탐사',role:1};
 const sceneState=stage===3&&question===3?{p1Complete:true,dataSent:true,q2Complete:true}:stage===4?{patternA:true,filmB:true,overlayComplete:true,lensAcquired:true,photosRestored:{A:true,B:true,C:true},nebulaComplete:question===4,lockerActive:question===4,dataSent:question===4,clusterComplete:question===4,handleUnlocked:question===4,lockerOpen:question===4,uvAcquired:question===4}:{};
 const state={session:{code:'SOLO',title:'1인 자유 탐사',durationSeconds:0,startedAt,expiresAt:null},serverTime:startedAt,player,progress:{stage,question,questionCount:[3,3,4,4][stage-1],completedAt:null,hintCount:0,penaltySeconds:0,remainingSeconds:86400,lastSubmitter:null,lastActionStatus:null,lastActionAt:null,sceneState},members:[{...player,online:true}],leaderboard:[],teacherHints:[]};
 const identity=['SOLO',player.team,1,startedAt].join(':'), identity4=['SOLO',player.team,player.id,startedAt].join(':');
 ['01-v6','02-v1','03-v1'].forEach(s=>localStorage.setItem('scilab-star-escape-scene'+s+':'+identity+':intro-v2','done'));
 localStorage.setItem('scilab-star-escape-scene01-v6:'+identity+':q3-guide','seen');
 localStorage.setItem('scilab-star-escape-scene04-v1:'+identity4+':intro-step-v2','999');
 localStorage.setItem('scilab-star-escape-scene04-v1:'+identity4+':reception-seen','yes');
 localStorage.setItem('scilab-star-escape-scene03-ending:SOLO:'+player.team+':'+startedAt,'done');
 localStorage.setItem('scilab-star-escape-solo',JSON.stringify(state));
 frame.src='index.html?mode=solo&review='+Date.now();
}
document.getElementById('scene').onchange=loadScene;
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{const size=button.dataset.size.split(',');frame.style.width=size[0]==='full'?'100%':size[0]+'px';frame.style.height=size[0]==='full'?'calc(100vh - 58px)':size[1]+'px';});
loadScene();
</script></html>
